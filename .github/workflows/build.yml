
name: Build C++ to EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Find and compile C++ files
        shell: msys2 {0}
        run: |
          shopt -s nullglob
          files=(*.cpp)

          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No .cpp file found in repository root."
            exit 1
          fi

          g++ "${files[@]}" -std=c++17 -O2 -static -o aplikasi.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-windows
          path: aplikasi.exe
          if-no-files-found: error
          retention-days: 7
