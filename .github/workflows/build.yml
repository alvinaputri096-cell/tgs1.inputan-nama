
name: Build C++ EXE

on:
  workflow_dispatch:
  push:
    paths:
      - '**.cpp'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Compile C++ to EXE
        shell: msys2 {0}
        run: |
          mkdir -p dist
          shopt -s nullglob
          files=( *.cpp )
          if [ ${#files[@]} -eq 0 ]; then
            echo "Tidak ada file .cpp di folder utama!"
            exit 1
          fi
          for file in "${files[@]}"; do
            name="${file%.cpp}"
            g++ -std=c++17 -O2 "$file" -o "dist/${name}.exe"
          done

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: cpp-exe
          path: dist/*.exe
          if-no-files-found: error
